server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.application.name=ai-mentor-backend

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aimentordb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiry-ms=18000000
jwt.refresh-token-expiry-ms=2592000000
jwt.warning-threshold-seconds=600

# ── Spring AI — Gemini via OpenAI-compatible endpoint ────────────────────────
#
# Google officially exposes an OpenAI-compatible API at:
#   https://generativelanguage.googleapis.com/v1beta/openai/
#
# This endpoint accepts the same request/response format as OpenAI's Chat API,
# so spring-ai-starter-model-openai works out of the box — no Vertex AI,
# no GCP project, no billing required.  A free Gemini API key is all you need.
#
# Get your free API key at: https://aistudio.google.com/app/apikey
#
# ┌─ Connection ──────────────────────────────────────────────────────────────┐
spring.ai.openai.api-key=${GEMINI_API_KEY:AQ.}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌─ Chat model options ───────────────────────────────────────────────────────┐
# gemini-2.0-flash  — free tier, fast, 1M token context window
# gemini-1.5-pro    — free tier (rate-limited), smarter for complex tasks
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=8192
# └───────────────────────────────────────────────────────────────────────────┘
#
# To switch to real OpenAI later, change ONLY these four lines:
#   spring.ai.openai.api-key=sk-...
#   spring.ai.openai.base-url=https://api.openai.com   (or remove it entirely)
#   spring.ai.openai.chat.options.model=gpt-4o-mini
#   (remove GEMINI_API_KEY from env)
# No Java code changes needed.
logging.level.org.springframework.ai=INFO

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=ai-mentor/sessions

# ── Rate Limiting ─────────────────────────────────────────────────────────────
rate-limit.general.capacity=60
rate-limit.general.refill-per-minute=60
rate-limit.ai.capacity=10
rate-limit.ai.refill-per-minute=10
rate-limit.auth.capacity=10
rate-limit.auth.refill-per-minute=5

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowedorigins=http://localhost:5173,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,X-XSRF-Token
cors.exposed-headers=Authorization,X-RateLimit-Remaining,X-RateLimit-Limit,X-Token-Expires-At,X-Token-Warning,X-Token-Seconds-Remaining
cors.max-age-seconds=3600

# ── Security ──────────────────────────────────────────────────────────────────
security.max-input-length=5000
security.max-failed-attempts=5
security.lockout-duration-minutes=30
security.password-min-length=8

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=AI Mentor
info.app.version=1.0.0

logging.level.com.aimentor=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{30} - %msg%n
